name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format)
        run: uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy
      - name: pytest
        run: uv run pytest -q

  web:
    name: Web — lint, types, contrast, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: WCAG contrast gate
        run: npm run check:contrast
      - name: Production build
        run: npm run build

  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Assert no .env or key-like blobs are tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production)$|secrets\.toml$'; then
            echo "::error::A secrets file is tracked by git."
            exit 1
          fi
          if git grep -nE 'sk-[A-Za-z0-9_-]{20,}' -- . ':!*.example' ':!docs/*'; then
            echo "::error::An API-key-shaped string is committed."
            exit 1
          fi
          echo "No committed secrets found."
